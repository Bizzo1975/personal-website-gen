name: Deploy to Prod — willworkforlunch.com

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Deploy to prod-personal-website-v2 (VMID 302)
        shell: powershell
        run: |
          $sshExe = "C:\Program Files\Git\usr\bin\ssh.exe"
          $keyPath = "C:\Users\jonkd\.ssh\id_ed25519"
          $script = "cd /opt/docker/personal-website && git pull origin production && docker compose up -d --build && docker compose ps"
          & $sshExe -o BatchMode=yes -i $keyPath -o ConnectTimeout=30 kecktech@100.80.117.115 $script
          if ($LASTEXITCODE -ne 0) { throw "Deploy failed with exit code $LASTEXITCODE" }
